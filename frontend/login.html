<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="gov-card p-4">
          <div class="text-center mb-4">
            <div class="mb-3">
              <span class="bidverify-pill-brand">BidVerify</span>
            </div>
            <h4 class="fw-bold text-dark">Sign In to BidVerify</h4>
            <p class="small text-muted mb-0">Authorized access for Procurement Officers and Registered Bidders</p>
          </div>

          <div id="login-alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Official Email Address</label>
              <input type="email" id="email" class="form-control" placeholder="officer@gem.gov.in" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="••••••••" required />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="toggle-password-btn"
                  onclick="togglePassword('password', 'password-eye-icon')"
                  title="Toggle password visibility"
                >
                  <i class="bi bi-eye" id="password-eye-icon"></i>
                </button>
              </div>
            </div>
            <button type="submit" id="login-btn" class="btn btn-primary w-100 fw-semibold py-2">
              Sign In
            </button>
          </form>

          <div class="text-center mt-4 small">
            Don't have an account? <a href="/register.html" class="fw-semibold">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    document.getElementById("navbar-container").innerHTML = renderPublicNavbar();

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Authenticating...";
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const data = await apiRequest("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        Auth.setSession(data.token, data.user);
        if (data.user.role === "PROCUREMENT_OFFICER") {
          window.location.href = "/officer/dashboard.html";
        } else {
          window.location.href = "/company/dashboard.html";
        }
      } catch (err) {
        showAlert("login-alert", err.message || "Invalid credentials");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
