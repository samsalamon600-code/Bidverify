<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="gov-card p-4">
          <div class="d-flex align-items-center gap-3 mb-4">
            <span class="bidverify-pill-brand">BidVerify</span>
            <div>
              <h4 class="fw-bold text-dark mb-0">Portal Registration</h4>
              <p class="small text-muted mb-0">Create an account as an Offering Company (Bidder) or Authorized Procurement Officer.</p>
            </div>
          </div>

          <div id="register-alert"></div>

          <form id="register-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Account Role</label>
                <select id="role" class="form-select" onchange="toggleRoleFields()">
                  <option value="COMPANY">Offering Company / Bidder</option>
                  <option value="PROCUREMENT_OFFICER">Procurement Officer</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Authorized Person Full Name</label>
                <input type="text" id="full_name" class="form-control" placeholder="e.g. Rohan Verma" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@organization.in" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="e.g. Pass@12"
                    minlength="4"
                    maxlength="8"
                    required
                  />
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="toggle-password-btn"
                    onclick="togglePassword('password', 'password-eye-icon')"
                    title="Toggle password visibility"
                  >
                    <i class="bi bi-eye" id="password-eye-icon"></i>
                  </button>
                </div>
                <div class="form-text small text-muted mt-1">
                  Must be 4&ndash;8 characters and contain at least 1 symbol.
                </div>
              </div>
            </div>

            <!-- Company Specific Fields -->
            <div id="company-fields" class="row g-3 mt-1">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Registered Company Name</label>
                <input type="text" id="company_name" class="form-control" placeholder="Bharat Infotech Pvt. Ltd." />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">GSTIN (15-character)</label>
                <input type="text" id="gstin" class="form-control" value="07AABCA1234C1Z5" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Corporate PAN</label>
                <input type="text" id="pan" class="form-control" value="AABCA1234C" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Udyam MSME Number</label>
                <input type="text" id="udyam_number" class="form-control" value="UDYAM-DL-01-0012345" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Local Content (%)</label>
                <input type="number" id="local_content_percent" class="form-control" value="65" min="0" max="100" />
              </div>
            </div>

            <!-- Officer Specific Fields -->
            <div id="officer-fields" class="row g-3 mt-1 d-none">
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Officer Employee ID</label>
                <input type="text" id="employee_id" class="form-control" placeholder="GEM-OFF-2040" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Department</label>
                <input type="text" id="department" class="form-control" value="Central Procurement Division" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Designation</label>
                <input type="text" id="designation" class="form-control" value="Procurement Officer" />
              </div>
            </div>

            <div class="mt-4">
              <button type="submit" id="reg-btn" class="btn btn-primary w-100 fw-semibold py-2">
                Complete Registration
              </button>
            </div>
          </form>

          <div class="text-center mt-3 small">
            Already registered? <a href="/login.html" class="fw-semibold">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    document.getElementById("navbar-container").innerHTML = renderPublicNavbar();

    function toggleRoleFields() {
      const role = document.getElementById("role").value;
      document.getElementById("company-fields").classList.toggle("d-none", role !== "COMPANY");
      document.getElementById("officer-fields").classList.toggle("d-none", role !== "PROCUREMENT_OFFICER");
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
      }
    }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-btn");
      btn.disabled = true;
      btn.textContent = "Creating Account...";

      const password = document.getElementById("password").value;
      if (password.length < 4) {
        showAlert("register-alert", "Password must contain at least 4 characters.");
        btn.disabled = false;
        btn.textContent = "Complete Registration";
        return;
      }
      if (password.length > 8) {
        showAlert("register-alert", "Password must not exceed 8 characters.");
        btn.disabled = false;
        btn.textContent = "Complete Registration";
        return;
      }
      if (!/[^a-zA-Z0-9\s]/.test(password)) {
        showAlert("register-alert", "Password must contain at least 1 symbol (e.g. @, #, $, %, etc.).");
        btn.disabled = false;
        btn.textContent = "Complete Registration";
        return;
      }

      try {
        const role = document.getElementById("role").value;
        const payload = {
          role,
          full_name: document.getElementById("full_name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: password,
          company_name: document.getElementById("company_name").value.trim(),
          gstin: document.getElementById("gstin").value.trim(),
          pan: document.getElementById("pan").value.trim(),
          udyam_number: document.getElementById("udyam_number").value.trim(),
          local_content_percent: document.getElementById("local_content_percent").value,
          employee_id: document.getElementById("employee_id").value.trim(),
          department: document.getElementById("department").value.trim(),
          designation: document.getElementById("designation").value.trim(),
        };
        const data = await apiRequest("/api/auth/register", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        Auth.setSession(data.token, data.user);
        window.location.href =
          data.user.role === "PROCUREMENT_OFFICER"
            ? "/officer/dashboard.html"
            : "/company/dashboard.html";
      } catch (err) {
        showAlert("register-alert", err.message);
        btn.disabled = false;
        btn.textContent = "Complete Registration";
      }
    });
  </script>
</body>
</html>
