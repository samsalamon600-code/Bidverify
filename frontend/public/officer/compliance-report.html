<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Compliance Report | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <label class="small fw-bold text-muted">Select Bid for Report Generation:</label>
            <select id="bid-selector" class="form-select form-select-sm" style="width:360px;" onchange="window.location.href='/officer/compliance-report.html?bid_id='+this.value"></select>
          </div>
          <button id="gen-pdf-btn" class="btn btn-success fw-semibold" onclick="generateAndDownloadPDF()">
            Generate &amp; Download Official PDF Report (ReportLab)
          </button>
        </div>

        <div id="rpt-alert"></div>
        <div id="rpt-preview">Loading report preview...</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "compliance-report", "Generate Downloadable PDF Compliance Report");

    let currentBidId = getQueryParam("bid_id") || "1";

    async function generateAndDownloadPDF() {
      const btn = document.getElementById("gen-pdf-btn");
      btn.disabled = true;
      btn.textContent = "Generating PDF via ReportLab...";
      try {
        const res = await apiRequest(`/api/bids/${currentBidId}/report`, { method: "POST" });
        const token = Auth.getToken() || "";
        const downloadUrl = `${res.download_url}&token=${encodeURIComponent(token)}`;
        showAlert(
          "rpt-alert",
          `Report <strong>${res.report.report_code}</strong> generated! <a href="${downloadUrl}" target="_blank" class="fw-bold alert-link">Click here if download does not start automatically.</a>`,
          "success"
        );
        window.open(downloadUrl, "_blank");
        await loadReportPreview();
      } catch (err) {
        showAlert("rpt-alert", err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate & Download Official PDF Report (ReportLab)";
      }
    }

    async function loadReportPreview() {
      try {
        const allBidsRes = await apiRequest("/api/bids");
        const allBids = allBidsRes.bids || [];
        if (allBids.length && !getQueryParam("bid_id")) {
          currentBidId = String(allBids[0].id);
        }
        document.getElementById("bid-selector").innerHTML = allBids.map(b => `
          <option value="${b.id}" ${String(b.id) === String(currentBidId) ? "selected" : ""}>
            ${b.bid_number} — ${b.company_name} (${b.overall_compliance_score}%)
          </option>
        `).join("");

        const data = await apiRequest(`/api/bids/${currentBidId}`);
        const b = data.bid;
        const c = b.company || {};
        const t = b.tender || {};
        const r = b.risk_analysis || {};
        const reports = b.reports || [];
        const token = encodeURIComponent(Auth.getToken() || "");

        const failedChecks = (b.compliance_results || []).filter(chk => chk.status === "NON_COMPLIANT");
        const reviewChecks = (b.compliance_results || []).filter(chk => chk.status === "NEEDS_REVIEW");

        document.getElementById("rpt-preview").innerHTML = `
          <div class="gov-card p-4 mb-4">
            <div class="border-bottom pb-3 mb-3 d-flex justify-content-between align-items-start">
              <div>
                <div class="small text-muted fw-bold">GOVERNMENT e-MARKETPLACE (GeM) &bull; REPORTLAB PREVIEW</div>
                <h4 class="fw-bold text-dark mb-1">BID COMPLIANCE VERIFICATION REPORT</h4>
                <div class="small text-muted">Tender: <strong>${t.tender_code}</strong> &mdash; ${t.title}</div>
              </div>
              <div class="text-end">
                <div class="small text-muted">Overall Compliance Score</div>
                <div class="fs-3 fw-bold text-dark">${b.overall_compliance_score}%</div>
                ${renderRiskBadge(b.risk_level)}
              </div>
            </div>

            <div class="row g-3 small mb-3">
              <div class="col-md-6">
                <strong>Bidder Company:</strong> ${c.company_name}<br/>
                <strong>GSTIN / PAN:</strong> ${c.gstin} / ${c.pan}<br/>
                <strong>Udyam MSME ID:</strong> ${c.udyam_number || "N/A"}<br/>
                <strong>Quoted Amount:</strong> ${formatINR(b.quoted_amount)}
              </div>
              <div class="col-md-6">
                <strong>Document Compliance:</strong> ${b.document_compliance_score}%<br/>
                <strong>Statutory Compliance:</strong> ${b.statutory_compliance_score}%<br/>
                <strong>Technical Compliance:</strong> ${b.technical_compliance_score}%<br/>
                <strong>Tender Policy Compliance:</strong> ${b.tender_compliance_score}%
              </div>
            </div>

            <div class="p-3 bg-light rounded border small mb-3">
              <div class="fw-bold text-dark mb-1">Failed Requirements (${failedChecks.length}) &amp; Needs-Review Items (${reviewChecks.length})</div>
              ${failedChecks.length === 0 && reviewChecks.length === 0
                ? `<div class="text-success">All mandatory documents, statutory registrations, and technical specifications are compliant.</div>`
                : [...failedChecks, ...reviewChecks].map(item => `
                    <div class="mb-1">&bull; ${renderStatusBadge(item.status)} <strong>${item.check_name}:</strong> ${item.reason}</div>
                  `).join("")}
            </div>

            <div class="p-3 bg-light rounded border small mb-3">
              <div class="fw-bold text-dark mb-1">Statistical Risk &amp; Anomaly Analysis</div>
              <div>${r.ml_explanation || "Evaluated within normal procurement bounds."}</div>
            </div>

            <div class="p-3 bg-light rounded border small">
              <div class="fw-bold text-dark mb-1">Authorized Officer Human Review Sign-Off</div>
              <div><strong>Status:</strong> ${renderStatusBadge(b.officer_review_status)}</div>
              <div class="mt-1"><strong>Officer Comments:</strong> ${b.officer_review_comments || "Pending final officer remarks."}</div>
            </div>
          </div>

          <div class="gov-card">
            <div class="gov-card-header">
              <span>Generated PDF Reports History for ${b.bid_number} (${reports.length})</span>
            </div>
            <div class="table-responsive">
              <table class="table table-gov table-hover mb-0 small">
                <thead>
                  <tr>
                    <th>Report ID</th>
                    <th>Generated Timestamp</th>
                    <th>Score Snapshot</th>
                    <th>Risk Snapshot</th>
                    <th>Download</th>
                  </tr>
                </thead>
                <tbody>
                  ${reports.length ? reports.map(rp => `
                    <tr>
                      <td class="fw-bold">${rp.report_code}</td>
                      <td>${formatDate(rp.generated_at)}</td>
                      <td>${rp.overall_score}%</td>
                      <td>${renderRiskBadge(rp.risk_level)}</td>
                      <td>
                        <a href="/api/reports/${rp.id}?download=true&token=${token}" target="_blank" class="btn btn-sm btn-outline-success py-0">Download PDF</a>
                      </td>
                    </tr>
                  `).join("") : `<tr><td colspan="5" class="text-center text-muted py-3">Click "Generate & Download Official PDF Report" above to create the first PDF report for this bid.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        showAlert("rpt-alert", err.message);
      }
    }
    loadReportPreview();
  </script>
</body>
</html>
