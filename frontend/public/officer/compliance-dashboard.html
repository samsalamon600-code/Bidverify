<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Dashboard | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <label class="small fw-bold text-muted">Select Bid:</label>
            <select id="bid-selector" class="form-select form-select-sm" style="width:340px;" onchange="window.location.href='/officer/compliance-dashboard.html?bid_id='+this.value"></select>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-warning fw-semibold" onclick="reRunVerify()">Re-Compute Compliance Score</button>
            <a id="evidence-link" href="/officer/evidence-viewer.html" class="btn btn-sm btn-outline-dark">Open Evidence Viewer</a>
            <a id="report-link" href="/officer/compliance-report.html" class="btn btn-sm btn-success">Generate PDF Report</a>
          </div>
        </div>

        <div id="comp-alert"></div>
        <div id="comp-content">Loading compliance scorecard...</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "compliance-dashboard", "Compliance Scorecard & Requirement Matrix");

    let currentBidId = getQueryParam("bid_id") || "1";

    async function reRunVerify() {
      try {
        await apiRequest(`/api/bids/${currentBidId}/verify`, { method: "POST" });
        showAlert("comp-alert", "Compliance checks re-evaluated successfully.", "success");
        await loadCompliance();
      } catch (err) {
        showAlert("comp-alert", err.message);
      }
    }

    async function loadCompliance() {
      try {
        const allBidsRes = await apiRequest("/api/bids");
        const allBids = allBidsRes.bids || [];
        if (allBids.length && !getQueryParam("bid_id")) {
          currentBidId = String(allBids[0].id);
        }
        document.getElementById("bid-selector").innerHTML = allBids.map(b => `
          <option value="${b.id}" ${String(b.id) === String(currentBidId) ? "selected" : ""}>
            ${b.bid_number} — ${b.company_name} (Score: ${b.overall_compliance_score}%)
          </option>
        `).join("");

        document.getElementById("evidence-link").href = `/officer/evidence-viewer.html?bid_id=${currentBidId}`;
        document.getElementById("report-link").href = `/officer/compliance-report.html?bid_id=${currentBidId}`;

        const data = await apiRequest(`/api/bids/${currentBidId}/compliance`);
        const cs = data.category_scores || {};
        const w = data.weights || { DOCUMENT: 0.25, STATUTORY: 0.25, TECHNICAL: 0.30, TENDER: 0.20 };
        const checks = data.compliance_results || [];

        const compliantCount = checks.filter(c => c.status === "COMPLIANT").length;
        const nonCompliantCount = checks.filter(c => c.status === "NON_COMPLIANT").length;
        const reviewCount = checks.filter(c => c.status === "NEEDS_REVIEW").length;

        document.getElementById("comp-content").innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <div class="gov-card p-3 h-100">
                <div class="small text-muted fw-bold">DOCUMENT COMPLIANCE (Weight ${Math.round(w.DOCUMENT*100)}%)</div>
                <div class="fs-3 fw-bold text-dark">${cs.document_compliance}%</div>
                <div class="progress mt-2" style="height:6px;">
                  <div class="progress-bar bg-primary" style="width:${cs.document_compliance}%"></div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="gov-card p-3 h-100">
                <div class="small text-muted fw-bold">STATUTORY COMPLIANCE (Weight ${Math.round(w.STATUTORY*100)}%)</div>
                <div class="fs-3 fw-bold text-dark">${cs.statutory_compliance}%</div>
                <div class="progress mt-2" style="height:6px;">
                  <div class="progress-bar bg-info" style="width:${cs.statutory_compliance}%"></div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="gov-card p-3 h-100">
                <div class="small text-muted fw-bold">TECHNICAL COMPLIANCE (Weight ${Math.round(w.TECHNICAL*100)}%)</div>
                <div class="fs-3 fw-bold text-dark">${cs.technical_compliance}%</div>
                <div class="progress mt-2" style="height:6px;">
                  <div class="progress-bar bg-success" style="width:${cs.technical_compliance}%"></div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="gov-card p-3 h-100">
                <div class="small text-muted fw-bold">TENDER COMPLIANCE (Weight ${Math.round(w.TENDER*100)}%)</div>
                <div class="fs-3 fw-bold text-dark">${cs.tender_compliance}%</div>
                <div class="progress mt-2" style="height:6px;">
                  <div class="progress-bar bg-warning" style="width:${cs.tender_compliance}%"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="gov-card p-4 mb-4 d-flex flex-wrap justify-content-between align-items-center">
            <div>
              <h5 class="fw-bold mb-1">${data.bid_number} &mdash; ${data.company_name}</h5>
              <div class="small text-muted">Tender: ${data.tender_code} (${data.tender_title})</div>
            </div>
            <div class="d-flex align-items-center gap-4">
              <div class="text-center">
                <div class="small text-muted">Compliant Checks</div>
                <span class="badge badge-compliant fs-6">${compliantCount}</span>
              </div>
              <div class="text-center">
                <div class="small text-muted">Needs Review</div>
                <span class="badge badge-review fs-6">${reviewCount}</span>
              </div>
              <div class="text-center">
                <div class="small text-muted">Non-Compliant</div>
                <span class="badge badge-noncompliant fs-6">${nonCompliantCount}</span>
              </div>
              <div class="text-center border-start ps-4">
                <div class="small text-muted fw-bold">OVERALL SCORE</div>
                <div class="fs-2 fw-bold text-dark">${data.overall_compliance_score}%</div>
              </div>
              <div class="text-center">
                <div class="small text-muted fw-bold">RISK LEVEL</div>
                <div class="mt-1">${renderRiskBadge(data.risk_level)}</div>
              </div>
            </div>
          </div>

          <div class="gov-card">
            <div class="gov-card-header">
              <span>Clause-by-Clause Requirement vs Submission Verification Table</span>
            </div>
            <div class="table-responsive">
              <table class="table table-gov table-hover mb-0 small">
                <thead>
                  <tr>
                    <th>Category</th>
                    <th>Compliance Check</th>
                    <th>Tender Requirement</th>
                    <th>Bidder Submission</th>
                    <th>Result</th>
                    <th>Reason &amp; Evidence Source</th>
                  </tr>
                </thead>
                <tbody>
                  ${checks.map(c => `
                    <tr>
                      <td><span class="badge bg-secondary">${c.category}</span></td>
                      <td class="fw-semibold">${c.check_name}</td>
                      <td>${c.requirement_text}</td>
                      <td class="fw-bold">${c.submitted_text}</td>
                      <td>${renderStatusBadge(c.status)}</td>
                      <td>
                        <div>${c.reason}</div>
                        <div class="text-muted" style="font-size:0.74rem;">Adapter/Engine: ${c.integration_source}</div>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        showAlert("comp-alert", err.message);
      }
    }
    loadCompliance();
  </script>
</body>
</html>
