<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tender Details &amp; Specifications | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div class="mb-3 d-flex justify-content-between align-items-center">
          <a href="/officer/manage-tenders.html" class="btn btn-sm btn-outline-secondary">
            &larr; Back to Manage Tenders
          </a>
          <div class="d-flex gap-2" id="tender-action-buttons"></div>
        </div>
        <div id="tender-alert"></div>
        <div id="tender-detail-container">Loading tender details...</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "manage-tenders", "Tender Specifications & Received Bids");

    async function confirmDeleteTender(id, code, bidCount) {
      const warningMsg = bidCount > 0
        ? `Are you sure you want to permanently delete Tender "${code}"?\n\nWARNING: This tender already has ${bidCount} submitted bid(s). Deleting it will permanently remove the tender along with all associated bids, documents, and evaluation records!`
        : `Are you sure you want to permanently delete Tender "${code}"?`;

      if (!confirm(warningMsg)) return;

      try {
        const res = await apiRequest(`/api/tenders/${id}`, { method: "DELETE" });
        alert(res.message || `Tender "${code}" deleted successfully.`);
        window.location.href = "/officer/manage-tenders.html";
      } catch (err) {
        alert(`Failed to delete tender: ${err.message}`);
      }
    }

    async function notifyTenderBidded(id, code) {
      const confirmed = confirm(
        `Send a formal notification to BOTH Tender Evaluation Officers and participating Bidders that the requirements for tender "${code}" are already bidded and actively in evaluation?`
      );
      if (!confirmed) return;

      try {
        const res = await apiRequest(`/api/tenders/${id}/notify-bidded`, { method: "POST" });
        alert(res.message || `Notification sent to both officer and bidders successfully!`);
        if (typeof refreshNotifications === "function") {
          refreshNotifications();
        }
      } catch (err) {
        alert(`Failed to send notification: ${err.message}`);
      }
    }

    async function loadTenderDetails() {
      const tenderId = getQueryParam("tender_id");
      const container = document.getElementById("tender-detail-container");

      if (!tenderId) {
        container.innerHTML = `
          <div class="gov-card p-4 text-center">
            <div class="text-warning fs-3 mb-2">&#9888;</div>
            <h5 class="fw-bold">No Tender Selected</h5>
            <p class="text-muted small">Please select a tender from the Manage Tenders page.</p>
            <a href="/officer/manage-tenders.html" class="btn btn-primary btn-sm">Go to Manage Tenders</a>
          </div>
        `;
        return;
      }

      try {
        const [tRes, bRes] = await Promise.all([
          apiRequest(`/api/tenders/${tenderId}`),
          apiRequest(`/api/bids?tender_id=${tenderId}`).catch(() => ({ bids: [] })),
        ]);

        const t = tRes.tender;
        if (!t) {
          container.innerHTML = `<div class="alert alert-danger">Tender #${tenderId} could not be found.</div>`;
          return;
        }

        const bids = bRes.bids || [];
        const reqDocs = Array.isArray(t.required_documents) ? t.required_documents.join(", ") : (t.required_documents || "None specified");
        const structReqs = t.structured_requirements || [];

        document.getElementById("tender-action-buttons").innerHTML = `
          <button class="btn btn-sm btn-outline-danger fw-semibold" onclick="confirmDeleteTender(${t.id}, '${t.tender_code}', ${bids.length})" title="Delete tender">
            &#128465; Delete Tender
          </button>
        `;

        container.innerHTML = `
          <div class="gov-card p-4 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start border-bottom pb-3 mb-3">
              <div>
                <span class="badge bg-secondary me-2">${t.tender_code}</span>
                ${renderStatusBadge(t.status)}
                <h4 class="fw-bold text-dark mt-2 mb-1">${t.title}</h4>
                <div class="text-muted small">${t.department} &bull; Category: <strong>${t.category || "-"}</strong></div>
              </div>
              <div class="text-end">
                <div class="small text-muted">Estimated Tender Value</div>
                <div class="fs-4 fw-bold text-dark">${formatINR(t.estimated_value)}</div>
                <div class="small text-muted">Closing Date: <strong>${t.closing_date || "Open"}</strong></div>
              </div>
            </div>

            ${t.description ? `<p class="text-muted small mb-3">${t.description}</p>` : ""}

            <div class="row g-3">
              <div class="col-md-6">
                <div class="p-3 bg-light rounded border h-100 small">
                  <div class="fw-bold text-dark mb-2">Technical &amp; Eligibility Requirements</div>
                  <div><strong>Technical:</strong> ${t.technical_requirements || "-"}</div>
                  <div class="mt-2"><strong>Eligibility:</strong> ${t.eligibility_requirements || "-"}</div>
                  <div class="mt-2"><strong>OEM Clause:</strong> ${t.oem_requirements || "-"}</div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="p-3 bg-light rounded border h-100 small">
                  <div class="fw-bold text-dark mb-2">Statutory &amp; Make in India (PPP-MII) Requirements</div>
                  <div><strong>Statutory:</strong> ${t.statutory_requirements || "-"}</div>
                  <div class="mt-2"><strong>Local Content (PPP-MII):</strong> Minimum <strong>${t.local_content_requirements}%</strong></div>
                  <div class="mt-2"><strong>Mandatory Documents:</strong> ${reqDocs}</div>
                </div>
              </div>
            </div>

            <h6 class="fw-bold mt-4 mb-2">Structured Compliance Rules (Database Driven)</h6>
            <div class="table-responsive">
              <table class="table table-sm table-bordered small mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Category</th>
                    <th>Parameter Name</th>
                    <th>Operator</th>
                    <th>Required Threshold</th>
                    <th>Mandatory</th>
                  </tr>
                </thead>
                <tbody>
                  ${structReqs.length === 0
                    ? `<tr><td colspan="5" class="text-center text-muted py-2">No structured technical parameters defined for this tender.</td></tr>`
                    : structReqs.map(r => `
                        <tr>
                          <td><span class="badge bg-secondary">${r.category}</span></td>
                          <td class="fw-semibold">${r.parameter_name}</td>
                          <td><code>${r.operator}</code></td>
                          <td class="fw-bold">${r.required_value} ${r.unit || ""}</td>
                          <td>${r.is_mandatory ? '<span class="badge bg-danger">Yes</span>' : '<span class="badge bg-light text-dark border">Optional</span>'}</td>
                        </tr>
                      `).join("")
                  }
                </tbody>
              </table>
            </div>
          </div>

          <div class="gov-card">
            <div class="gov-card-header d-flex justify-content-between align-items-center">
              <span>Bids Submitted for ${t.tender_code} (${bids.length})</span>
              ${bids.length > 0 ? `<a href="/officer/submitted-bids.html?tender_id=${t.id}" class="btn btn-sm btn-outline-primary">Open Full Bid Evaluation View</a>` : ""}
            </div>
            <div class="table-responsive">
              <table class="table table-gov table-hover mb-0 small">
                <thead>
                  <tr>
                    <th>Bid Number</th>
                    <th>Bidder Company</th>
                    <th>Quoted Amount</th>
                    <th>Compliance Score</th>
                    <th>Risk Level</th>
                    <th>Officer Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${bids.length === 0
                    ? `<tr><td colspan="7" class="text-center text-muted py-4">No bids submitted for this tender yet. As soon as a bidder applies, their submission will appear here.</td></tr>`
                    : bids.map(b => `
                        <tr>
                          <td class="fw-bold">${b.bid_number}</td>
                          <td>${b.company_name}</td>
                          <td>${formatINR(b.quoted_amount)}</td>
                          <td class="fw-bold text-primary">${b.overall_compliance_score}%</td>
                          <td>${renderRiskBadge(b.risk_level)}</td>
                          <td>${renderStatusBadge(b.officer_review_status)}</td>
                          <td style="text-align: right;">
                            <div class="btn-group btn-group-sm">
                              <a href="/officer/bid-details.html?bid_id=${b.id}" class="btn btn-primary">Inspect &amp; Review</a>
                              <a href="/officer/compliance-dashboard.html?bid_id=${b.id}" class="btn btn-outline-secondary">Scorecard</a>
                            </div>
                          </td>
                        </tr>
                      `).join("")
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error loading tender details: ${err.message}</div>`;
      }
    }

    loadTenderDetails();
  </script>
</body>
</html>
