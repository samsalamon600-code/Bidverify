<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officer Profile | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div id="prof-alert"></div>
        <div class="gov-card p-4" style="max-width:720px;">
          <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-3">
            <div id="prof-avatar" class="avatar-circle" style="width:56px; height:56px; font-size:1.6rem;">O</div>
            <div>
              <h5 class="fw-bold mb-0 text-dark" id="prof-name">Authorized Procurement Officer</h5>
              <div class="text-muted small" id="prof-subtitle">Official Profile &amp; Credentials</div>
            </div>
          </div>
          <form id="officer-profile-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" id="full_name" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Official Email (Read-only)</label>
                <input type="email" id="email" class="form-control bg-light" readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Employee ID</label>
                <input type="text" id="employee_id" class="form-control bg-light" readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Designation</label>
                <input type="text" id="designation" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Department</label>
                <input type="text" id="department" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Ministry</label>
                <input type="text" id="ministry" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Official Phone</label>
                <input type="text" id="phone" class="form-control" />
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary fw-semibold px-4">Update Officer Profile</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "profile", "Procurement Officer Profile");

    async function loadProfile() {
      try {
        const data = await apiRequest("/api/auth/me");
        const u = data.user;
        const off = u.officer || {};

        const rawName = (u.full_name || u.email || "Officer").trim();
        const cleanName = rawName.replace(/^(Dr\.|Mr\.|Mrs\.|Ms\.|Shri|Prof\.)\s+/i, "").trim();
        const letter = (cleanName.charAt(0) || rawName.charAt(0) || "O").toUpperCase();
        document.getElementById("prof-avatar").textContent = letter;
        document.getElementById("prof-name").textContent = u.full_name || "Procurement Officer";
        document.getElementById("prof-subtitle").textContent = `${off.designation || "Officer"} • ${off.department || "GeM Procurement Division"}`;

        document.getElementById("full_name").value = u.full_name || "";
        document.getElementById("email").value = u.email || "";
        document.getElementById("employee_id").value = off.employee_id || "";
        document.getElementById("designation").value = off.designation || "";
        document.getElementById("department").value = off.department || "";
        document.getElementById("ministry").value = off.ministry || "";
        document.getElementById("phone").value = off.phone || "";
      } catch (err) {
        showAlert("prof-alert", err.message);
      }
    }

    document.getElementById("officer-profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const res = await apiRequest("/api/auth/profile", {
          method: "PUT",
          body: JSON.stringify({
            full_name: document.getElementById("full_name").value.trim(),
            designation: document.getElementById("designation").value.trim(),
            department: document.getElementById("department").value.trim(),
            ministry: document.getElementById("ministry").value.trim(),
            phone: document.getElementById("phone").value.trim(),
          }),
        });
        Auth.setSession(Auth.getToken(), res.user);
        showAlert("prof-alert", "Officer profile updated successfully.", "success");
      } catch (err) {
        showAlert("prof-alert", err.message);
      }
    });

    loadProfile();
  </script>
</body>
</html>
