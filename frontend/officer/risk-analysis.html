<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk &amp; Anomaly Analysis | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <label class="small fw-bold text-muted">Inspect Bid Risk:</label>
            <select id="bid-selector" class="form-select form-select-sm" style="width:360px;" onchange="window.location.href='/officer/risk-analysis.html?bid_id='+this.value"></select>
          </div>
          <a id="review-btn" href="/officer/bid-details.html" class="btn btn-sm btn-primary">Go to Officer Human Review</a>
        </div>

        <div id="risk-alert"></div>
        <div id="risk-content">Loading Risk &amp; Anomaly Analysis...</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "risk-analysis", "Risk & Anomaly Analysis");

    let currentBidId = getQueryParam("bid_id") || "3"; // Default to Bid #3 (Warranty=30 yrs anomaly) if not specified

    async function loadRiskPage() {
      try {
        const allBidsRes = await apiRequest("/api/bids");
        const allBids = allBidsRes.bids || [];
        if (allBids.length && !getQueryParam("bid_id")) {
          const anomalyBid = allBids.find(b => b.bid_number.includes("1003")) || allBids[0];
          currentBidId = String(anomalyBid.id);
        }

        document.getElementById("bid-selector").innerHTML = allBids.map(b => `
          <option value="${b.id}" ${String(b.id) === String(currentBidId) ? "selected" : ""}>
            ${b.bid_number} — ${b.company_name} [${b.risk_level} RISK]
          </option>
        `).join("");
        document.getElementById("review-btn").href = `/officer/bid-details.html?bid_id=${currentBidId}`;

        const data = await apiRequest(`/api/bids/${currentBidId}/risk`);
        const r = data.risk_analysis || {};
        const factors = r.risk_factors || [];

        document.getElementById("risk-content").innerHTML = `
          <div class="row g-4 mb-4">
            <div class="col-md-4">
              <div class="gov-card p-4 h-100 text-center">
                <div class="small text-muted fw-bold text-uppercase mb-2">Overall Risk Classification</div>
                <div class="my-2">${renderRiskBadge(r.risk_level)}</div>
                <div class="small text-muted mt-2">Composite Risk Score: <strong>${r.risk_score ?? 0} / 100</strong></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="gov-card p-4 h-100 text-center">
                <div class="small text-muted fw-bold text-uppercase mb-2">Statistical Anomaly Score</div>
                <div class="fs-2 fw-bold text-dark">${r.anomaly_score ?? 0}</div>
                <div class="mt-1">
                  ${r.is_anomaly_flagged
                    ? `<span class="badge badge-review">Potential Anomaly &rarr; Human Review Required</span>`
                    : `<span class="badge badge-compliant">Within Normal Peer Distribution</span>`}
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="gov-card p-4 h-100">
                <div class="small text-muted fw-bold text-uppercase mb-2">Anomaly Model Explanation</div>
                <p class="small mb-0 text-dark">${r.ml_explanation || "No anomalies detected."}</p>
              </div>
            </div>
          </div>

          <div class="gov-card">
            <div class="gov-card-header">
              <span>Explainable Risk &amp; Anomaly Factors Generating Risk Level (${r.risk_level})</span>
            </div>
            <div class="table-responsive">
              <table class="table table-gov table-hover mb-0 small">
                <thead>
                  <tr>
                    <th>Severity</th>
                    <th>Risk / Anomaly Category</th>
                    <th>Detailed Explanation &amp; Action Required</th>
                  </tr>
                </thead>
                <tbody>
                  ${factors.map(f => `
                    <tr>
                      <td>${renderRiskBadge(f.severity)}</td>
                      <td><span class="badge bg-secondary">${f.category}</span></td>
                      <td class="fw-semibold">${f.factor}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        showAlert("risk-alert", err.message);
      }
    }
    loadRiskPage();
  </script>
</body>
</html>
