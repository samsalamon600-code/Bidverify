<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submitted Bids | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Procurement Officer Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div id="bids-alert"></div>

        <div class="gov-card">
          <div class="gov-card-header flex-wrap gap-2">
            <span>All Submitted Bidder Proposals</span>
            <div class="d-flex flex-wrap gap-2">
              <select id="filter-risk" class="form-select form-select-sm" style="width:auto;" onchange="loadBids()">
                <option value="">All Risk Levels</option>
                <option value="LOW">Low Risk</option>
                <option value="MEDIUM">Medium Risk</option>
                <option value="HIGH">High Risk</option>
              </select>
              <select id="filter-status" class="form-select form-select-sm" style="width:auto;" onchange="loadBids()">
                <option value="">All Verification Statuses</option>
                <option value="VERIFIED">Verified</option>
                <option value="NEEDS_REVIEW">Needs Review</option>
                <option value="PENDING">Pending</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-gov table-hover mb-0 small">
              <thead>
                <tr>
                  <th>Bid #</th>
                  <th>Tender</th>
                  <th>Bidder Company</th>
                  <th>Quoted Amount</th>
                  <th>Warranty / MII</th>
                  <th>Docs</th>
                  <th>Compliance Score</th>
                  <th>Risk Level</th>
                  <th>Officer Review</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="bids-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("PROCUREMENT_OFFICER", "submitted-bids", "Submitted Bids & Verification Queue");

    async function runVerification(bidId, btn) {
      btn.disabled = true;
      btn.textContent = "Verifying...";
      try {
        const res = await apiRequest(`/api/bids/${bidId}/verify`, { method: "POST" });
        showAlert(
          "bids-alert",
          `Verification completed for <strong>${res.bid_number}</strong>: Overall Score = <strong>${res.overall_compliance_score}%</strong>, Risk = <strong>${res.risk_level}</strong>.`,
          "success"
        );
        await loadBids();
      } catch (err) {
        showAlert("bids-alert", err.message);
        btn.disabled = false;
        btn.textContent = "Verify";
      }
    }

    async function loadBids() {
      const tenderId = getQueryParam("tender_id") || "";
      const risk = document.getElementById("filter-risk").value;
      const status = document.getElementById("filter-status").value;
      const params = new URLSearchParams();
      if (tenderId) params.set("tender_id", tenderId);
      if (risk) params.set("risk_level", risk);
      if (status) params.set("verification_status", status);

      const tbody = document.getElementById("bids-tbody");
      try {
        const data = await apiRequest(`/api/bids?${params.toString()}`);
        const bids = data.bids || [];
        if (!bids.length) {
          tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted py-4">No bids match the selected filters.</td></tr>`;
          return;
        }
        tbody.innerHTML = bids.map(b => `
          <tr>
            <td class="fw-bold">${b.bid_number}</td>
            <td><a href="/officer/tender-details.html?tender_id=${b.tender_id}" class="text-decoration-none">${b.tender_code}</a></td>
            <td>
              <div class="fw-semibold">${b.company_name}</div>
              <div class="text-muted" style="font-size:0.74rem;">GSTIN: ${b.company_gstin || "-"}</div>
            </td>
            <td class="fw-semibold">${formatINR(b.quoted_amount)}</td>
            <td>${b.warranty_years} Yrs / ${b.local_content_declared}%</td>
            <td><span class="badge bg-secondary">${b.document_count} files</span></td>
            <td>
              <div class="fw-bold">${b.overall_compliance_score}%</div>
              <div class="progress mt-1" style="height:5px; width:75px;">
                <div class="progress-bar ${b.overall_compliance_score >= 85 ? 'bg-success' : b.overall_compliance_score >= 65 ? 'bg-warning' : 'bg-danger'}" style="width:${b.overall_compliance_score}%"></div>
              </div>
            </td>
            <td>${renderRiskBadge(b.risk_level)}</td>
            <td>${renderStatusBadge(b.officer_review_status)}</td>
            <td>
              <div class="d-flex flex-wrap gap-1">
                <a href="/officer/bid-details.html?bid_id=${b.id}" class="btn btn-sm btn-primary py-0">Review Details</a>
                <button class="btn btn-sm btn-outline-success py-0" onclick="quickDecide(${b.id}, 'APPROVED')" title="Approve Bid">&#10003; Approve</button>
                <button class="btn btn-sm btn-outline-danger py-0" onclick="quickDecide(${b.id}, 'REJECTED')" title="Reject Bid">&#10005; Reject</button>
              </div>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        showAlert("bids-alert", err.message);
      }
    }

    async function quickDecide(bidId, status) {
      if (!confirm(`Are you sure you want to mark this bid as ${status}?`)) return;
      try {
        await apiRequest(`/api/bids/${bidId}/review`, {
          method: "POST",
          body: JSON.stringify({
            review_status: status,
            review_comments: `Officer ${status} decision from Submitted Bids console`,
            mark_all_checks_reviewed: true
          }),
        });
        showAlert("bids-alert", `Bid updated to <strong>${status}</strong> successfully!`, "success");
        await loadBids();
      } catch (err) {
        showAlert("bids-alert", err.message);
      }
    }
    loadBids();
  </script>
</body>
</html>
