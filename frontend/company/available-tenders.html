<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Tenders | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Offering Company / Bidder Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Open GeM Procurement Tenders</h5>
          <input type="text" id="q" class="form-control form-control-sm" style="width:280px;" placeholder="Search by tender code, title, dept..." oninput="loadAvailableTenders()" />
        </div>
        <div id="tenders-grid" class="row g-3"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("COMPANY", "available-tenders", "Browse Available GeM Tenders");

    async function loadAvailableTenders() {
      const q = document.getElementById("q").value.trim();
      const grid = document.getElementById("tenders-grid");
      try {
        const data = await apiRequest(`/api/tenders?q=${encodeURIComponent(q)}`);
        const tenders = data.tenders || [];
        if (!tenders.length) {
          grid.innerHTML = `<div class="col-12"><div class="gov-card p-4 text-muted">No matching tenders found.</div></div>`;
          return;
        }
        grid.innerHTML = tenders.map(t => {
          const hasBidded = Boolean(t.has_bidded);
          const biddedAlert = hasBidded
            ? `<div class="alert alert-success py-1 px-2 small mb-2 d-flex align-items-center gap-1 border border-success">
                 <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/></svg>
                 <span><strong>Requirement Already Bidded</strong> (${t.existing_bid_number})</span>
               </div>`
            : (t.bid_count > 0 ? `<div class="text-muted small mb-2"><em>${t.bid_count} bid(s) received from peers</em></div>` : "");

          const actionBtn = hasBidded
            ? `<a href="/company/submission-status.html?bid_id=${t.existing_bid_id}" class="btn btn-success btn-sm w-50 fw-semibold text-truncate" title="View your submitted bid">View Your Bid</a>`
            : `<a href="/company/apply-tender.html?tender_id=${t.id}" class="btn btn-primary btn-sm w-50 fw-semibold">Apply</a>`;

          return `
          <div class="col-md-6 col-xl-4">
            <div class="gov-card h-100 p-4 d-flex flex-column justify-content-between ${hasBidded ? 'border-success' : ''}">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge bg-secondary">${t.tender_code}</span>
                  ${renderStatusBadge(t.status)}
                </div>
                <h5 class="fw-bold text-dark">${t.title}</h5>
                <div class="small text-muted mb-2">${t.department}</div>
                ${biddedAlert}
                <p class="small text-muted">${t.description || ""}</p>
                <div class="p-2 bg-light rounded border small mb-3">
                  <div><strong>Category:</strong> ${t.category}</div>
                  <div><strong>Closing Deadline:</strong> ${t.closing_date}</div>
                  <div><strong>Estimated Value:</strong> ${formatINR(t.estimated_value)}</div>
                  <div><strong>Min Local Content:</strong> ${t.local_content_requirements}%</div>
                </div>
              </div>
              <div class="d-flex gap-2">
                <a href="/company/tender-details.html?tender_id=${t.id}" class="btn btn-outline-primary btn-sm w-50">View Requirements</a>
                ${actionBtn}
              </div>
            </div>
          </div>
        `}).join("");

      } catch (err) {
        grid.innerHTML = `<div class="col-12 text-danger">${err.message}</div>`;
      }
    }
    loadAvailableTenders();
  </script>
</body>
</html>
