<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Statutory Profile | BidVerify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css?v=22" rel="stylesheet" />
</head>
<body>
  <div class="gov-top-strip">
    <div class="container-fluid px-4">Government of India &bull; GeM Offering Company / Bidder Portal</div>
  </div>
  <div class="app-wrapper">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <main class="app-main">
      <header id="app-header" class="app-header"></header>
      <div class="app-content">
        <div id="comp-prof-alert"></div>
        <div class="gov-card p-4" style="max-width:820px;">
          <h5 class="fw-bold border-bottom pb-2 mb-3">Offering Company Statutory &amp; GeM Profile</h5>
          <form id="company-profile-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Registered Company Legal Name</label>
                <input type="text" id="company_name" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Authorized Representative Name</label>
                <input type="text" id="full_name" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">GSTIN (15-character)</label>
                <input type="text" id="gstin" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Corporate PAN</label>
                <input type="text" id="pan" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Udyam MSME Registration No.</label>
                <input type="text" id="udyam_number" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">MCA Corporate Identity No. (CIN)</label>
                <input type="text" id="registration_number" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Enterprise Category</label>
                <select id="enterprise_type" class="form-select">
                  <option value="Micro Enterprise">Micro Enterprise</option>
                  <option value="Small Enterprise">Small Enterprise</option>
                  <option value="Medium Enterprise">Medium Enterprise</option>
                  <option value="Large Enterprise">Large Enterprise</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Default Local Content (%)</label>
                <input type="number" step="0.1" id="local_content_percent" class="form-control" />
              </div>
              <div class="col-md-8">
                <label class="form-label small fw-semibold">Registered Office Address</label>
                <input type="text" id="address" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Contact Phone</label>
                <input type="text" id="contact_phone" class="form-control" />
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary fw-semibold px-4">Save Company Statutory Profile</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=22"></script>
  <script>
    initAuthenticatedLayout("COMPANY", "profile", "Company Statutory Profile");

    async function loadCompanyProfile() {
      try {
        const data = await apiRequest("/api/auth/me");
        const u = data.user;
        const c = u.company || {};
        document.getElementById("full_name").value = u.full_name || "";
        document.getElementById("company_name").value = c.company_name || "";
        document.getElementById("gstin").value = c.gstin || "";
        document.getElementById("pan").value = c.pan || "";
        document.getElementById("udyam_number").value = c.udyam_number || "";
        document.getElementById("registration_number").value = c.registration_number || "";
        document.getElementById("enterprise_type").value = c.enterprise_type || "Small Enterprise";
        document.getElementById("local_content_percent").value = c.local_content_percent ?? 60;
        document.getElementById("address").value = c.address || "";
        document.getElementById("contact_phone").value = c.contact_phone || "";
      } catch (err) {
        showAlert("comp-prof-alert", err.message);
      }
    }

    document.getElementById("company-profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const res = await apiRequest("/api/auth/profile", {
          method: "PUT",
          body: JSON.stringify({
            full_name: document.getElementById("full_name").value.trim(),
            company_name: document.getElementById("company_name").value.trim(),
            gstin: document.getElementById("gstin").value.trim(),
            pan: document.getElementById("pan").value.trim(),
            udyam_number: document.getElementById("udyam_number").value.trim(),
            registration_number: document.getElementById("registration_number").value.trim(),
            enterprise_type: document.getElementById("enterprise_type").value,
            local_content_percent: document.getElementById("local_content_percent").value,
            address: document.getElementById("address").value.trim(),
            contact_phone: document.getElementById("contact_phone").value.trim(),
          }),
        });
        Auth.setSession(Auth.getToken(), res.user);
        showAlert("comp-prof-alert", "Company statutory profile updated successfully.", "success");
      } catch (err) {
        showAlert("comp-prof-alert", err.message);
      }
    });

    loadCompanyProfile();
  </script>
</body>
</html>
